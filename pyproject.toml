[project]
name = "endeavor-ai"
version = "0.1.0"
description = "Endeavor AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.4.7",
    "celery>=5.6.2",
    "colorama>=0.4.6",
    "fastapi>=0.128.0",
    "fastapi-limiter>=0.1.6",
    "flower>=2.0.1",
    "httpx>=0.28.1",
    "openai>=2.16.0",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation-logging>=0.60b1",
    "opentelemetry-instrumentation-requests>=0.60b1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
]

[project.scripts]
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format = "ruff format ."

[dependency-groups]
dev = [
    "gradio>=6.5.1",
    "langfuse>=3.12.1",
    "openinference-instrumentation-agno>=0.1.27",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.ruff]
indent-width = 2
line-length = 79

[tool.ruff.lint.flake8-quotes]
avoid-escape = false

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
